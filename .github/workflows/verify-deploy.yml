name: Verify live deployments

on:
  workflow_dispatch: {}
  push:
    branches: [cloudflare-migration, claude/repo-recovery-hosting-ghqebk]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_URL: https://littlelionfund-source-5fhe.vercel.app
      CF_URL: https://littlelionfunddashboard.dwu-4ce.workers.dev
    steps:
      - name: Static site root (Cloudflare)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL/")
          echo "Cloudflare root -> HTTP $code"
          test "$code" = "200"

      - name: Compare public read-only API routes
        run: |
          set -x
          for route in "/api/holdings" "/api/weightings" "/api/unitvalue" "/api/cash" "/api/credits"; do
            echo "== $route =="
            vc=$(curl -s -o /tmp/vercel_body -w "%{http_code}" "$VERCEL_URL$route")
            cf=$(curl -s -o /tmp/cf_body -w "%{http_code}" "$CF_URL$route")
            echo "Vercel: HTTP $vc"; cat /tmp/vercel_body; echo
            echo "Cloudflare: HTTP $cf"; cat /tmp/cf_body; echo
          done

      - name: Live quote + history via Finnhub (Cloudflare)
        run: |
          set -x
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/quote?ticker=AAPL"
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/hist?ticker=AAPL"

      - name: Auth endpoint sanity check (wrong password, both platforms)
        run: |
          set -x
          curl -s -w "\nHTTP %{http_code}\n" "$VERCEL_URL/api/auth?pwd=definitely-wrong-xyz123&type=holdings"
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/auth?pwd=definitely-wrong-xyz123&type=holdings"

      - name: Real password test (holdings) — only if secret is set
        if: ${{ secrets.TEST_HOLDINGS_PWD != '' }}
        run: |
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PWD_VAL']))")
          echo "Testing real HOLDINGS_PWD against both platforms (password value itself is not printed)"
          vc=$(curl -s "$VERCEL_URL/api/auth?pwd=$enc&type=holdings")
          cf=$(curl -s "$CF_URL/api/auth?pwd=$enc&type=holdings")
          echo "Vercel result: $vc"
          echo "Cloudflare result: $cf"
        env:
          PWD_VAL: ${{ secrets.TEST_HOLDINGS_PWD }}

      - name: Real password test (weightings) — only if secret is set
        if: ${{ secrets.TEST_WEIGHTINGS_PWD != '' }}
        run: |
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PWD_VAL']))")
          echo "Testing real WEIGHTINGS_PWD against both platforms (password value itself is not printed)"
          vc=$(curl -s "$VERCEL_URL/api/auth?pwd=$enc&type=weightings")
          cf=$(curl -s "$CF_URL/api/auth?pwd=$enc&type=weightings")
          echo "Vercel result: $vc"
          echo "Cloudflare result: $cf"
        env:
          PWD_VAL: ${{ secrets.TEST_WEIGHTINGS_PWD }}
