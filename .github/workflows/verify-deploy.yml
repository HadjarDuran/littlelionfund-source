name: Verify live deployments

on:
  workflow_dispatch: {}
  push:
    branches: [cloudflare-migration, claude/repo-recovery-hosting-ghqebk]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_URL: https://littlelionfund-source-5fhe.vercel.app
      CF_URL: https://littlelionfunddashboard.dwu-4ce.workers.dev
      # `secrets.X` can't be read inside an `if:` expression directly (GitHub
      # Actions rejects the whole workflow at parse time if you try — that
      # was silently failing every run here). Mirroring them into job-level
      # env vars first lets the conditional steps below check env.X instead.
      TEST_HOLDINGS_PWD: ${{ secrets.TEST_HOLDINGS_PWD }}
      TEST_WEIGHTINGS_PWD: ${{ secrets.TEST_WEIGHTINGS_PWD }}
    steps:
      - uses: actions/checkout@v4

      # Proves Cloudflare actually deployed THIS commit's site: the live copies
      # of a few frontend files must be byte-identical to the ones in this
      # commit. Cloudflare's own build (the real deploy path) finishes a minute
      # or two after a push, so this retries for up to ~6 minutes.
      - name: Live site is serving this commit's frontend (Cloudflare)
        run: |
          files="js/chart.js js/data.js js/ui.js js/app.js css/app.css"
          for i in $(seq 1 24); do
            bad=""
            for f in $files; do
              want=$(sha256sum "Lion/public/$f" | cut -d' ' -f1)
              got=$(curl -s -H 'Cache-Control: no-cache' "$CF_URL/$f?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
              [ "$want" = "$got" ] || bad="$bad $f"
            done
            if [ -z "$bad" ]; then echo "Live site matches commit $GITHUB_SHA ($files)"; exit 0; fi
            echo "attempt $i: live copy differs for:$bad (deploy still running?)"; sleep 15
          done
          echo "::error::The live site is not serving this commit's files after 6 minutes. Check Cloudflare > Workers > littlelionfunddashboard > Deployments / Builds for a failed build."
          exit 1

      - name: Static site root (Cloudflare)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL/")
          echo "Cloudflare root -> HTTP $code"
          test "$code" = "200"

      - name: Compare public read-only API routes
        run: |
          set -x
          for route in "/api/holdings" "/api/weightings" "/api/unitvalue" "/api/cash" "/api/credits"; do
            echo "== $route =="
            vc=$(curl -s -o /tmp/vercel_body -w "%{http_code}" "$VERCEL_URL$route")
            cf=$(curl -s -o /tmp/cf_body -w "%{http_code}" "$CF_URL$route")
            echo "Vercel: HTTP $vc"; cat /tmp/vercel_body; echo
            echo "Cloudflare: HTTP $cf"; cat /tmp/cf_body; echo
          done

      - name: Holdings change log and daily NAV history (Cloudflare)
        run: |
          echo "== /api/holdings-log =="
          curl -s "$CF_URL/api/holdings-log"; echo
          echo "== /api/nav-history =="
          curl -s "$CF_URL/api/nav-history"; echo

      - name: Live quote + history via Finnhub (Cloudflare)
        run: |
          set -x
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/quote?ticker=AAPL"
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/hist?ticker=AAPL"

      - name: Price history freshness + short-term (1D/1W) prices (Cloudflare)
        run: |
          # Cloudflare finishes deploying a minute or two after this workflow
          # starts, so give the newest route a few tries before checking.
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL/api/intraday?ticker=SPY&range=1d")
            if [ "$code" = "200" ]; then break; fi
            echo "attempt $i: /api/intraday HTTP $code, waiting for the deploy"; sleep 30
          done
          summarize='import json,sys
          d = json.load(sys.stdin)
          if isinstance(d, list):
              print("  daily history:", len(d), "days, first", d[0]["date"] if d else None, "last", d[-1]["date"] if d else None)
          else:
              p = d.get("points") or []
              print("  bars:", len(p), "| first", p[0]["t"] if p else None, "| last", p[-1] if p else None, "| prevClose", d.get("prevClose"), "| stale", d.get("stale", False), "| error", d.get("error"))'
          for t in SPY QQQ AAPL; do echo "/api/hist $t"; curl -s "$CF_URL/api/hist?ticker=$t" | python3 -c "$summarize" || true; done
          for q in "SPY&range=1d" "AAPL&range=1d" "AAPL&range=5d"; do echo "/api/intraday $q"; curl -s "$CF_URL/api/intraday?ticker=$q" | python3 -c "$summarize" || true; done

      - name: Auth endpoint sanity check (wrong password, both platforms)
        run: |
          set -x
          curl -s -w "\nHTTP %{http_code}\n" "$VERCEL_URL/api/auth?pwd=definitely-wrong-xyz123&type=holdings"
          curl -s -w "\nHTTP %{http_code}\n" "$CF_URL/api/auth?pwd=definitely-wrong-xyz123&type=holdings"

      - name: Real password test (holdings) — only if secret is set
        if: ${{ env.TEST_HOLDINGS_PWD != '' }}
        run: |
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['TEST_HOLDINGS_PWD']))")
          echo "Testing real HOLDINGS_PWD against both platforms (password value itself is not printed)"
          vc=$(curl -s "$VERCEL_URL/api/auth?pwd=$enc&type=holdings")
          cf=$(curl -s "$CF_URL/api/auth?pwd=$enc&type=holdings")
          echo "Vercel result: $vc"
          echo "Cloudflare result: $cf"

      - name: Real password test (weightings) — only if secret is set
        if: ${{ env.TEST_WEIGHTINGS_PWD != '' }}
        run: |
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['TEST_WEIGHTINGS_PWD']))")
          echo "Testing real WEIGHTINGS_PWD against both platforms (password value itself is not printed)"
          vc=$(curl -s "$VERCEL_URL/api/auth?pwd=$enc&type=weightings")
          cf=$(curl -s "$CF_URL/api/auth?pwd=$enc&type=weightings")
          echo "Vercel result: $vc"
          echo "Cloudflare result: $cf"
