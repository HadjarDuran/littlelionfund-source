name: Restore holdings from a snapshot

# Manual recovery tool: replaces the live holdings list with a JSON array
# passed as input. Logs in the same way the app does, using the holdings
# password from the TEST_HOLDINGS_PWD repository secret (Settings > Secrets
# and variables > Actions), so the password never appears anywhere else.

on:
  workflow_dispatch:
    inputs:
      holdings_json:
        description: Full holdings list as a JSON array
        required: true
  # Pushing a change to this file registers the workflow with GitHub so it
  # can be dispatched from a non-default branch; push runs do nothing.
  push:
    paths:
      - .github/workflows/restore-holdings.yml

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CF_URL: https://littlelionfunddashboard.dwu-4ce.workers.dev
      HOLDINGS_PWD: ${{ secrets.TEST_HOLDINGS_PWD }}
      HOLDINGS_JSON: ${{ inputs.holdings_json }}
    steps:
      - name: Restore
        run: |
          if [ -z "$HOLDINGS_PWD" ]; then
            echo "::error::Add a TEST_HOLDINGS_PWD repository secret (the holdings password) first."
            exit 1
          fi
          printf '%s' "$HOLDINGS_JSON" > /tmp/holdings.json
          python3 - <<'EOF'
          import json
          h = json.load(open('/tmp/holdings.json'))
          assert isinstance(h, list) and h, 'holdings_json must be a non-empty JSON array'
          for x in h:
              assert {'t', 'sh', 'ac', 's'} <= set(x), f'holding missing fields: {x}'
          print(len(h), 'holdings to restore')
          EOF
          enc=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['HOLDINGS_PWD'], safe=''))")
          token=$(curl -s "$CF_URL/api/auth?pwd=$enc&type=holdings" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          if [ -z "$token" ]; then
            echo "::error::The holdings password in TEST_HOLDINGS_PWD was rejected."
            exit 1
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data @/tmp/holdings.json "$CF_URL/api/holdings")
          cat /tmp/out; echo
          test "$code" = "200"
          curl -s "$CF_URL/api/holdings" | python3 -c "import json,sys; print(len(json.load(sys.stdin)), 'holdings now live')"
