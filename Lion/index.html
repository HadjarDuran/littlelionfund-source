<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Little Lion Fund</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #d9e0f0;
      --surf: #eef3fb;
      --card: #ffffff;
      --border: #cddaef;
      --accent: #2d4a3e;
      --blue: #5e7fd0;
      --green: #3fa874;
      --red: #c95f5f;
      --yellow: #c09040;
      --text: #1a2840;
      --muted: #64708c;
      --dim: #eef3fb;
      --chart-bg: #eef3fb;
      --nav-bg: #ffffff;
      --sh: 0 2px 10px rgba(45, 74, 62, 0.10), 0 0 0 1px rgba(45, 74, 62, 0.07);
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      font-size: 13px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--blue);
      border-radius: 4px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2563ebcc
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      appearance: none;
      -webkit-appearance: none;
      margin: 0
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    @keyframes fin {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(.98)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes rowIn {
      from {
        opacity: 0;
        transform: translateX(-6px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes drawLine {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0)
      }

      40% {
        transform: translateY(-6px)
      }

      60% {
        transform: translateY(-3px)
      }
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(0deg)
      }

      25% {
        transform: rotate(-3deg)
      }

      75% {
        transform: rotate(3deg)
      }
    }



    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      10%,
      30%,
      50%,
      70%,
      90% {
        transform: translateX(-2px)
      }

      20%,
      40%,
      60%,
      80% {
        transform: translateX(2px)
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg)
      }

      to {
        transform: rotate(360deg)
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 1
      }

      100% {
        transform: scale(4);
        opacity: 0
      }
    }

    @keyframes blink {

      0%,
      50% {
        opacity: 1
      }

      51%,
      100% {
        opacity: 0
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes underlineSlide {
      from {
        border-bottom-width: 0
      }

      to {
        border-bottom-width: 2px
      }
    }

    .fin {
      animation: fin .25s cubic-bezier(.22, .68, 0, 1.2) both
    }

    .bounce {
      animation: bounce .6s ease
    }

    .wiggle {
      animation: wiggle .5s ease
    }

    .glow {
      animation: glow 2s ease-in-out infinite
    }

    .shake {
      animation: shake .5s ease
    }

    .float {
      animation: float 3s ease-in-out infinite
    }

    .spin {
      animation: spin 1s linear infinite
    }

    .ripple {
      animation: ripple .6s ease-out
    }

    .blink {
      animation: blink 1s infinite
    }

    .slide-in-left {
      animation: slideInLeft .3s ease-out
    }

    .slide-in-right {
      animation: slideInRight .3s ease-out
    }

    .zoom-in {
      animation: zoomIn .3s ease-out
    }

    .underline-slide {
      animation: underlineSlide .3s ease
    }

    #gtt {
      display: none;
      position: fixed;
      background: var(--accent);
      color: #fff;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.15);
      letter-spacing: 0.2px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }
    #gtt.visible {
      opacity: 1;
      transform: translateY(0);
    }


    #ls {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000
    }

    .ls-wrap {
      width: 300px;
      text-align: center
    }

    .ls-logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 44px;
      letter-spacing: -1px;
      color: var(--accent);
      margin-bottom: 4px;
      animation: float 3s ease-in-out infinite
    }

    .ls-logo span {
      color: var(--blue)
    }

    .ls-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 38px;
      font-weight: 600
    }

    .ls-msg {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 20px;
      font-weight: 500
    }

    .ls-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden
    }

    .ls-fill {
      height: 3px;
      background: var(--blue);
      border-radius: 2px;
      transition: width .5s ease;
      width: 0%;
      animation: glow 1s ease-in-out infinite
    }

    .ls-detail {
      font-size: 11px;
      color: #94a3b8;
      min-height: 16px;
      margin-bottom: 10px
    }

    .ls-tickers {
      font-size: 10px;
      font-family: 'DM Sans', sans-serif;
      min-height: 22px;
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 10px;
      background: var(--dim);
      border-radius: 7px;
      border: 1px solid var(--border);
      text-align: left;
      letter-spacing: .3px;
      margin-bottom: 4px
    }

    .ls-credits {
      font-size: 11px;
      color: #64748b;
      letter-spacing: .6px;
      font-style: italic;
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none
    }

    .ls-keybtn {
      display: none;
      padding: 9px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      transition: background .15s
    }

    .ls-keybtn:hover {
      background: var(--blue)
    }

    .ls-err {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: 12px;
      color: var(--red);
      line-height: 1.7;
      text-align: left;
      animation: wiggle .5s ease
    }


    #app {
      display: none
    }

    nav {
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0;
    }

    .logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: -.5px;
      color: var(--accent)
    }

    .logo span {
      color: var(--blue)
    }

    .tab {
      padding: 7px 15px;
      border: none;
      cursor: pointer;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(26,40,64,0.55);
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .tab i {
      font-size: 10px;
      transition: transform .2s
    }

    .tab:hover {
      color: var(--accent)
    }

    .tab:hover i {
      transform: scale(1.1)
    }

    .tab.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent)
    }


    .nr {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px
    }

    .ld {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600
    }

    .dotv {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite
    }

    .kbtn {
      height: 32px;
      padding: 0 13px;
      border-radius: 7px;
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.10);
      color: rgba(26,40,64,0.65);
      cursor: pointer;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s
    }

    .kbtn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,0,0,0.08)
    }

    .kbtn:active {
      transform: scale(.98)
    }

    .sg {
      padding: 18px 28px 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px
    }

    .sg-asof {
      padding: 10px 28px 0;
    }

    .sc {
      background: var(--card);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: var(--sh);
      cursor: default
    }

    .sl {
      font-size: 11px;
      letter-spacing: 0;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sv {
      font-family: 'DM Sans', sans-serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2
    }

    #content {
      padding: 18px 28px 52px
    }

    /* dashboard */
    .dg {
      display: grid;
      grid-template-columns: 1fr 275px;
      gap: 16px
    }

    .panel {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      overflow: hidden;
      animation: slideUp .2s ease both;
    }

    .ph {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      letter-spacing: 0;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    thead tr {
      background: var(--dim)
    }

    th {
      padding: 10px 15px;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
      text-transform: uppercase
    }

    th:first-child {
      text-align: left
    }

    td {
      padding: 11px 15px;
      border-bottom: 1px solid #e2e5eb;
      text-align: right;
      white-space: nowrap;
      font-size: 13px;
      transition: padding .1s
    }

    td:first-child {
      text-align: left
    }

    tbody tr {
      cursor: pointer;
      transition: background .12s
    }

    tbody tr:hover {
      background: rgba(37, 99, 235, 0.13)
    }

    tbody tr:hover td {
      color: var(--text)
    }

    .tcell {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .d9 {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .tn {
      font-weight: 700;
      font-size: 14px
    }

    .tsub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px
    }

    .sbadge {
      font-size: 9px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: .3px;
      border: 1px solid currentColor;
      opacity: 0.85
    }

    .apanel {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 20px;
      animation: slideUp .2s .05s ease both;
    }

    .alist {
      margin-top: 10px
    }

    .arow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 11px
    }

    .arow:last-child {
      border-bottom: none
    }

    .aname {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted)
    }

    .sec-stack {
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .sec-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      overflow: hidden;
      animation: slideInLeft .3s ease both
    }

    .sec-hdr {
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--dim)
    }

    .sec-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.3px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--accent)
    }

    .sec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%
    }

    .sec-stats {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
      font-weight: 500
    }

    .sec-body {
      padding: 20px 22px;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      align-items: start
    }

    .chart-div {
      width: 100%;
      background: var(--chart-bg);
      border-radius: 12px;
      padding: 8px
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .stk-card {
      background: var(--dim);
      border-radius: 10px;
      padding: 13px 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color .15s
    }

    .stk-card:hover {
      border-color: var(--blue);
    }

    .stk-title {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 2px
    }

    .stk-sub {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px
    }

    .stk-foot {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px
    }

    .perf-hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .bbtn {
      padding: 6px 14px;
      border-radius: 7px;
      background: var(--dim);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s
    }

    .bbtn:hover {
      background: #eff6ff;
      border-color: var(--blue);
      color: var(--blue)
    }

    .bbtn i {
      transition: transform .15s
    }

    .bbtn:hover i {
      transform: translateX(-2px)
    }

    .ptitle {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--accent)
    }

    .pstats {
      display: flex;
      gap: 12px 20px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      min-width: 0;
      overflow: hidden
    }

    .pstats b {
      font-weight: 600;
      color: var(--text)
    }

    .tf-btn {
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }

    .chdiv {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 26px;
      animation: scaleIn .3s ease both
    }

    .clbl {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 600;
      text-transform: uppercase
    }

    .sgrid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px
    }

    .scard {
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--sh);
      padding: 14px 16px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color .15s, transform .12s, box-shadow .15s
    }

    .scard:hover {
      border-color: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.1);
      animation: zoomIn .2s ease
    }

    .hgrid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px
    }

    .fpanel {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 24px;
      animation: zoomIn .3s ease both
    }

    .fl {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase
    }

    .fi {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surf);
      color: var(--text);
      font-size: 13px;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .2s, box-shadow .2s
    }

    .fi:focus {
      border-color: var(--blue);
      transform: scale(1.02)
    }

    .cd-trigger {
      padding: 0 12px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surf);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all .2s;
      min-width: 140px
    }

    .cd-trigger:hover {
      border-color: var(--blue);
      background: rgba(37, 99, 235, 0.02)
    }

    .cd-menu {
      position: fixed;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border-radius: 12px;
      z-index: 9999;
      min-width: 200px;
      overflow: hidden;
      animation: popIn .2s ease forwards;
      transform-origin: top left
    }

    .cd-item {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .cd-item:hover {
      background: var(--blue);
      color: #fff
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-10px)
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .fg {
      margin-bottom: 14px
    }

    .fb {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);

      .pstats { font-size: 15px; gap: 14px 22px }

      /* The Performance chart's timeframe row (1 Month..Since Buy, up to 7
         buttons) had no wrap or scroll on mobile — it just overflowed off

         Wrap it, and drop margin-left:auto (which only made sense pushing
         the row right in a single line next to the title) so it uses the

         guidance too — they were only ~24px tall before. */
      .tf-bar { flex-wrap: wrap; margin-left: 0 !important; width: 100% }

  <script>
    // No hardcoded fallback key: a Finnhub key baked into public client code
    // is a leaked credential the moment this file is on GitHub. Users can
    // still add their own personal key via "Change API Key" for the backup
    // history fetch; without one, that fallback is simply skipped.
    let API_KEY = localStorage.getItem("llf_key") || "";
    const FB = "https://finnhub.io/api/v1";
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    const SM = {
      "Information Technology": { color: "#2563eb" },
      "Communication Services": { color: "#7c3aed" },
      // Fuchsia/gold instead of literal red/green — every other sector color
      // is purely decorative, but a red or green sector chart reads as
      // losing/making money regardless of that sector's actual trend.
      "Consumer Staples": { color: "#a16207" },
      "Consumer Discretionary": { color: "#d97706" },
      "Health Care": { color: "#c026d3" },
      "Industrials": { color: "#0891b2" },
      "Financials": { color: "#0369a1" },
      "Energy + Utilities": { color: "#ea580c" },
    };
    // Was a hardcoded constant; now fetched from /api/units so it can
    // change (new contributions/redemptions) without a code deploy. Keeps
    // this default so nothing breaks before that endpoint is ever called.
    let UNITS = 4111.03;
    const DOTC = ["#2563eb", "#7c3aed", "#d97706", "#059669", "#dc2626", "#0891b2", "#ea580c",
      "#0369a1", "#16a34a", "#9333ea", "#0284c7", "#b45309", "#be185d", "#15803d",
      "#1d4ed8", "#c2410c", "#0e7490", "#6d28d9", "#047857", "#b91c1c", "#ca8a04", "#0f766e"];

    const REFRESH_INTERVAL = 120;
    let AUTH_TOKENS = { holdings: null, weightings: null };
    let HOLD = [], CASH_BANK = 0, CASH_BROK = 0;
    let prices = {}, hist = {}, portHist = [];
    let curTab = "dashboard", detailT = null, editIdx = null, deletingIdx = null, deletingWeightIdx = null, uvDeletingIdx = null, perfTimeframe = "1 Year", holdingsUnlocked = false, weightingsUnlocked = false, unitvalueUnlocked = false, uvEditIdx = null, allocView = 'stocks', isOffline = false, detailSector = null, sectorTimeframe = "1 Month";
    let lastDataUpdate = null; // when loadAll() last completed successfully — the "Data as of" trust stamp on the Dashboard
    let _posCache = null, _posCacheKey = "", _portHistDirty = true;
    let weightingsData = [];
    function toggleAllocView() {
      allocView = allocView === 'stocks' ? 'sectors' : 'stocks';
      renderDash(document.getElementById("content"));
    }


    const fU = n => "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fS = n => (n >= 0 ? "+ " : "− ") + fU(n);
    const fP = n => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    const cl = n => n >= 0 ? "var(--green)" : "var(--red)";

    async function fetchWithRetry(url, opts = {}, retries = 2) {
      for (let i = 0; i <= retries; i++) {
        try {
          const r = await fetchWithTimeout(url, opts, 6000);
          if (r.ok) return r;
        } catch (e) { if (i === retries) throw e; }
        await sleep(Math.pow(2, i) * 500);
      }
    }

    async function loadData() {
      try {
        const [holdingsRes, cashRes, weightingsRes, unitvalueRes, unitsRes] = await Promise.all([
          fetch('/api/holdings', { cache: 'no-store' }),
          fetch('/api/cash', { cache: 'no-store' }),
          fetch('/api/weightings', { cache: 'no-store' }),
          fetch('/api/unitvalue', { cache: 'no-store' }),
          fetch('/api/units', { cache: 'no-store' })
        ]);
        isOffline = false;
        const holdingsData = await holdingsRes.json();
        HOLD = Array.isArray(holdingsData) ? holdingsData : [];
        const cash = await cashRes.json();
        CASH_BANK = cash.bank || 0;
        CASH_BROK = cash.brokerage || 0;
        weightingsData = await weightingsRes.json();
        if (!weightingsData || weightingsData.length === 0) weightingsData = [];
        const uvData = await unitvalueRes.json();
        if (Array.isArray(uvData) && uvData.length > 0) UNIT_HISTORY = uvData;
        try { const unitsData = await unitsRes.json(); if (unitsData && unitsData.units > 0) UNITS = unitsData.units; } catch (e) { }
      } catch (error) {
        console.error('Failed to load data:', error);
        isOffline = true;
        HOLD = [];
        weightingsData = [];
      }
    }

    // A plain browser reload re-runs the whole boot sequence, including the
    // slow part: fetching every holding's quote and then its full price
    // history one at a time. Cache the small, fast-to-render fields (not
    // the multi-year price history — that can run into the low-MB range
    // across ~25 tickers and risks hitting localStorage's quota) so a quick
    // reload can paint the Dashboard instantly from the last successful
    // load, then refresh for real in the background. Browsers don't expose
    // "was this reload a hard reload" to JS, so there's no way to gate on
    // that literally — a genuine hard reload (or Reset Site Data, or private
    // browsing) just clears the cache along with everything else and falls
    // back to the full loading screen, which is the same outcome in practice.
    const SNAPSHOT_KEY = 'llf_snapshot_v1';
    const SNAPSHOT_TTL_MS = 5 * 60 * 1000;
    function saveSnapshotCache() {
      try {
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({
          ts: Date.now(), HOLD, CASH_BANK, CASH_BROK, prices, weightingsData, UNIT_HISTORY, UNITS
        }));
      } catch (e) { /* storage full/unavailable/private-browsing — just skip caching */ }
    }
    function loadSnapshotCache() {
      try {
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        if (!raw) return null;
        const snap = JSON.parse(raw);
        if (!snap || typeof snap.ts !== 'number' || Date.now() - snap.ts > SNAPSHOT_TTL_MS) return null;
        return snap;
      } catch (e) { return null; }
    }

    function authHeaders(scope) {
      const h = { 'Content-Type': 'application/json' };
      if (AUTH_TOKENS[scope]) h['Authorization'] = 'Bearer ' + AUTH_TOKENS[scope];
      return h;
    }

    async function saveUnitValue() {

    const fK = v => `$${(v / 1000).toFixed(1)}k`;
    const hexRgb = h => {
      const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
      return r ? `${parseInt(r[1], 16)},${parseInt(r[2], 16)},${parseInt(r[3], 16)}` : "100,100,100";
    };

    let keyModalOpen = false;
    function openKeyModal() { keyModalOpen = true; renderKeyModal(); }
    function closeKeyModal() { keyModalOpen = false; renderKeyModal(); }
    function saveKeyModal() {
      const input = document.getElementById("key-modal-input");
      const k = input ? input.value.trim() : "";
      if (k) { API_KEY = k; localStorage.setItem("llf_key", API_KEY); location.reload(); }
      else { closeKeyModal(); }
    }
    function renderKeyModal() {
      let el = document.getElementById("key-modal");
      if (!el) { el = document.createElement("div"); el.id = "key-modal"; document.body.appendChild(el); }
      if (!keyModalOpen) { el.innerHTML = ""; return; }
      el.innerHTML = `
      <div style="position:fixed; inset:0; background:rgba(45, 74, 62, 0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:500; animation: fadeIn .3s ease" onclick="closeKeyModal()"></div>
      <div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:501; padding:20px;">
        <div style="background:var(--card); padding:32px; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,0.4); text-align:center; width:340px; max-width:100%; animation: scaleIn .3s ease both;">
          <div style="width:64px; height:64px; background:var(--dim); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
            <i class="fa-solid fa-key" style="font-size:22px; color:var(--blue);"></i>
          </div>
          <div style="font-family:'DM Sans',sans-serif; font-weight:700; font-size:22px; color:var(--accent); margin-bottom:8px;">Backup API Key</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:20px; line-height:1.5">Optional. Used only as a fallback for chart history if the built-in source is unavailable. Stored on this device only.</div>
          <input id="key-modal-input" type="text" class="fi" placeholder="Finnhub API key" autocomplete="off"
            style="width:100%; text-align:center; margin-bottom:16px;" value="${API_KEY ? API_KEY.replace(/"/g, '&quot;') : ''}"
            onkeydown="if(event.key==='Enter')saveKeyModal()"/>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button class="fcb" onclick="closeKeyModal()" style="margin:0; padding:0; height:44px;">Cancel</button>
            <button class="fb" onclick="saveKeyModal()" style="margin:0; padding:0; height:44px;"><i class="fa-solid fa-floppy-disk"></i> Save</button>
          </div>
        </div>
      </div>`;
      setTimeout(() => { const inp = document.getElementById("key-modal-input"); if (inp) inp.focus(); }, 10);
    }

    let gc = 0;
    const pendingCharts = new Map();

    function drawChart(el, labels, data, color, height, opts = {}) {
      if (!el || !data || !data.length) return;
      requestAnimationFrame(() => {
        const W = el.getBoundingClientRect().width;
        if (W > 20) {
          _renderChart(el, labels, data, color, height, opts, W);
        } else {
          const key = el.id || ('c' + (gc++));
          if (!el.id) el.id = key;
          if (pendingCharts.has(key)) return;
          pendingCharts.set(key, { el, labels, data, color, height, opts });
          const ro = new ResizeObserver(entries => {
            for (const entry of entries) {
              const w = entry.contentRect.width;
              if (w > 20) {
                ro.disconnect();
                const p = pendingCharts.get(key);
                pendingCharts.delete(key);
                if (p) _renderChart(p.el, p.labels, p.data, p.color, p.height, p.opts, w);
              }
            }
          });
          ro.observe(el);
          setTimeout(() => {
            const W2 = el.getBoundingClientRect().width;
            if (W2 > 20 && pendingCharts.has(key)) { pendingCharts.delete(key); _renderChart(el, labels, data, color, height, opts, W2); }
          }, 300);
        }
      });
    }

    function _renderChart(el, labels, data, color, height, { dots = true, tight = false, yFmt = null, timeframe = "" } = {}, W) {
      const H = height, PL = 48, PR = 8, PT = 10, PB = tight ? 20 : 28, CW = W - PL - PR, CH = H - PT - PB;
      const mn = Math.min(...data), mx = Math.max(...data);
      const rng = mx - mn || Math.abs(mn) * 0.02 || 1;
      const pd = tight ? rng * 0.05 : rng * 0.1;
      const yLo = mn - pd, yHi = mx + pd, yRng = yHi - yLo;
      const xp = i => PL + (i / Math.max(data.length - 1, 1)) * CW;
      const yp = v => PT + CH * (1 - (v - yLo) / yRng);
      const pts = data.map((v, i) => ({ x: xp(i), y: yp(v), v, l: labels[i] || "" }));
      const id = "g" + (gc++), rgb = hexRgb(color);
      const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L ");
      const area = `M ${pts[0].x.toFixed(1)},${H} L ${line} L ${pts[pts.length - 1].x.toFixed(1)},${H} Z`;
      let grid = "", ylbls = "";
      const yTicks = tight ? 2 : 4;
      for (let i = 0; i <= yTicks; i++) {
        const v = yLo + yRng * i / yTicks, y = yp(v).toFixed(1);
        grid += `<line x1="${PL}" y1="${y}" x2="${PL + CW}" y2="${y}" stroke="rgba(26,40,64,0.08)" stroke-width="1"/>`;
        if (!tight || i === 0 || i === yTicks)
          ylbls += `<text x="${PL - 5}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#8090b8" font-family="DM Sans,sans-serif">${yFmt ? yFmt(v) : fU(v)}</text>`;
      }

      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      function fmtLabel(dateStr, prev, isTight) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-").map(Number);
        if (isTight) return MONTHS[m - 1] + " " + d;
        const prevY = prev ? +prev.split("-")[0] : null;
        const prevM = prev ? +prev.split("-")[1] : null;
        if (!prev || prevY !== y) return MONTHS[m - 1] + " '" + String(y).slice(2);
        if (prevM !== m) return MONTHS[m - 1];
        return MONTHS[m - 1];
      }

      let xlbls = "";
      const yBase = (PT + CH + 13).toFixed(1);
      if (tight) {
        const picks = [0, Math.floor((data.length - 1) / 2), data.length - 1];
        picks.forEach(i => {
          if (labels[i]) {
            const [, m, d] = labels[i].split("-").map(Number);
            const lbl = MONTHS[m - 1] + " " + d;
            xlbls += `<text x="${xp(i).toFixed(1)}" y="${yBase}" text-anchor="${i === 0 ? "start" : i === picks[picks.length - 1] ? "end" : "middle"}" font-size="8" fill="#8090b8" font-family="DM Sans,sans-serif">${lbl}</text>`;
          }
        });
      } else {
        const minGapPx = 70;
        let lastX = -999, lastDateStr = null;
        const candidates = [];
        for (let i = 0; i < data.length; i++) {
          const d = labels[i]; if (!d) continue;
          const m = +d.split("-")[1];
          const prev = i > 0 ? labels[i - 1] : null;
          const pm = prev ? +prev.split("-")[1] : null;
          if (i === 0 || i === data.length - 1 || m !== pm) candidates.push(i);
        }
        const maxLabels = Math.floor(CW / minGapPx);
        const step = Math.ceil((candidates.length - 2) / Math.max(maxLabels - 2, 1));
        const filteredCandidates = candidates.filter((idx, ci) => ci === 0 || ci === candidates.length - 1 || (step <= 1 ? true : ci % step === 0));
        filteredCandidates.forEach(i => {
          const x = xp(i);
          if (x - lastX < minGapPx && i !== 0 && i !== data.length - 1) return;
          const lbl = fmtLabel(labels[i], lastDateStr, false);
          const anchor = i === 0 ? "start" : i === data.length - 1 ? "end" : "middle";
          xlbls += `<text x="${x.toFixed(1)}" y="${yBase}" text-anchor="${anchor}" font-size="9" fill="#8090b8" font-family="DM Sans,sans-serif" font-weight="${i === 0 || i === data.length - 1 ? "600" : "400"}">${lbl}</text>`;
          lastX = x; lastDateStr = labels[i];
        });
      }

      const tfBadge = timeframe ? `<text x="${(PL + CW).toFixed(1)}" y="${PT + 1}" text-anchor="end" font-size="9" fill="${color}" font-family="DM Sans,sans-serif" font-weight="600" opacity="0.7">${timeframe}</text>` : "";

      let dotsSvg = "";
      if (dots) pts.forEach(p => { dotsSvg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}" stroke="white" stroke-width="1.5"/>`; });
      const chartId = "ch" + (gc++);
      let hovers = "";
      const totalLen = pts.reduce((acc, p, i) => i === 0 ? 0 : acc + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y), 0);
      pts.forEach((p, i) => {
        const x0 = (i === 0 ? PL : (pts[i - 1].x + p.x) / 2).toFixed(1);
        const x1 = (i === pts.length - 1 ? PL + CW : (p.x + pts[i + 1].x) / 2).toFixed(1);
        const val = yFmt ? yFmt(p.v) : fU(p.v);
        const [y, m, d] = p.l ? p.l.split("-").map(Number) : [0, 0, 0];
        const dateLbl = p.l ? `${MONTHS[m - 1]} ${d}, ${y}` : "";
        const tip = encodeURIComponent(`${dateLbl}  ${val}`);
        hovers += `<rect x="${x0}" y="${PT}" width="${(+x1 - +x0).toFixed(1)}" height="${CH}" fill="transparent" style="cursor:crosshair"
      onmouseover="showTip(event,'${tip}');showCursorDot('${chartId}',${p.x.toFixed(1)},${p.y.toFixed(1)},'${color}')"
      onmouseleave="hideTip();hideCursorDot('${chartId}')"/>`;
      });
      el.innerHTML = `<svg id="${chartId}" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgb(${rgb})" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="rgb(${rgb})" stop-opacity="0.01"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#${id})" style="animation:fadeIn .6s ease both"/>
    <path d="M ${line}" stroke="${color}" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"
      stroke-dasharray="${totalLen.toFixed(0)}" stroke-dashoffset="${totalLen.toFixed(0)}"
      style="animation:drawLine .8s ease forwards"/>
    ${dotsSvg}
    <line id="${chartId}-vl" x1="0" y1="${PT}" x2="0" y2="${PT + CH}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity="0" pointer-events="none"/>
    <circle id="${chartId}-cd" cx="0" cy="0" r="5" fill="${color}" stroke="white" stroke-width="2.5" opacity="0" pointer-events="none"/>
    ${hovers}${ylbls}${xlbls}${tfBadge}
  </svg>`;
    }

    // Drag-to-measure overlay for the Performance chart — press and drag
    // across the chart, release, and see the $ / % change and date span
    // between the two points (TradingView's "measure tool" pattern).
    // Deliberately kept out of _renderChart/drawChart entirely: this is a
    // separate layer appended on top of the SVG after the fact, so the
    // chart's own rendering and look are completely untouched whether or
    // not this attaches, and this can be removed cleanly without touching
    // chart code at all.
    //
    // PL/PR/PT/PB and the y-scale formula below intentionally mirror
    // _renderChart's internals (duplicated rather than shared, to avoid
    // modifying that function) — keep them in sync if _renderChart's
    // layout constants ever change.
    function attachDragMeasure(el, labels, data, { tight = false } = {}) {
      if (!el || !data || data.length < 2) return;
      let tries = 0;
      const poll = setInterval(() => {
        const svg = el.querySelector('svg');
        if (svg) { clearInterval(poll); wireMeasure(el, svg, labels, data, tight); return; }
        if (++tries > 100) clearInterval(poll); // chart never rendered (e.g. navigated away) — give up quietly
      }, 30);
    }

    function wireMeasure(container, svg, labels, data, tight) {
      const vb = (svg.getAttribute('viewBox') || '').split(' ').map(Number);
      const W = vb[2], H = vb[3];
      if (!W || !H) return;
      const PL = 48, PR = 8, PT = 10, PB = tight ? 20 : 28, CW = W - PL - PR, CH = H - PT - PB;
      const mn = Math.min(...data), mx = Math.max(...data);
      const rng = mx - mn || Math.abs(mn) * 0.02 || 1;
      const pd = tight ? rng * 0.05 : rng * 0.1;
      const yLo = mn - pd, yHi = mx + pd, yRng = yHi - yLo;
      const xp = i => PL + (i / Math.max(data.length - 1, 1)) * CW;
      const yp = v => PT + CH * (1 - (v - yLo) / yRng);

      const svgNS = 'http://www.w3.org/2000/svg';
      const g = document.createElementNS(svgNS, 'g');
      svg.appendChild(g);

      // pointer-events:none on every overlay shape so they're purely visual
      // and never steal the existing per-point hover tooltip's mouseover —
      // that keeps working exactly as before, even under an active selection.
      const band = document.createElementNS(svgNS, 'rect');
      band.setAttribute('y', PT); band.setAttribute('height', CH);
      band.setAttribute('fill', 'rgba(94,127,208,0.22)');
      band.setAttribute('opacity', '0');
      band.setAttribute('pointer-events', 'none');
      g.appendChild(band);
      function mkGuideLine() {
        const l = document.createElementNS(svgNS, 'line');
        l.setAttribute('y1', PT); l.setAttribute('y2', PT + CH);
        l.setAttribute('stroke', '#5e7fd0'); l.setAttribute('stroke-width', '1.5');
        l.setAttribute('stroke-dasharray', '4,3'); l.setAttribute('opacity', '0');
        l.setAttribute('pointer-events', 'none');
        g.appendChild(l);
        return l;
      }
      function mkDot() {
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('r', '4'); c.setAttribute('fill', '#5e7fd0');
        c.setAttribute('stroke', 'white'); c.setAttribute('stroke-width', '2');
        c.setAttribute('opacity', '0');
        c.setAttribute('pointer-events', 'none');
        g.appendChild(c);
        return c;
      }
      const lineA = mkGuideLine(), lineB = mkGuideLine();
      const dotA = mkDot(), dotB = mkDot();

      const label = document.createElement('div');
      label.style.cssText = 'position:absolute;pointer-events:none;background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .1s;z-index:50;line-height:1.4';
      container.style.position = 'relative';
      container.appendChild(label);

      function idxFromClientX(clientX) {
        const rect = svg.getBoundingClientRect();
        const px = (clientX - rect.left) * (W / rect.width);
        const frac = (px - PL) / CW;
        return Math.max(0, Math.min(data.length - 1, Math.round(frac * (data.length - 1))));
      }
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      function fmtDate(ds) { const [y, m, d] = ds.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }

      let dragging = false, startIdx = null, moved = false;

      function paint(iA, iB) {
        const lo = Math.min(iA, iB), hi = Math.max(iA, iB);
        const x0 = xp(lo), x1 = xp(hi);
        band.setAttribute('x', x0); band.setAttribute('width', Math.max(x1 - x0, 0));
        band.setAttribute('opacity', hi === lo ? '0' : '1');
        lineA.setAttribute('x1', x0); lineA.setAttribute('x2', x0); lineA.setAttribute('opacity', '0.8');
        lineB.setAttribute('x1', x1); lineB.setAttribute('x2', x1); lineB.setAttribute('opacity', '0.8');
        dotA.setAttribute('cx', x0); dotA.setAttribute('cy', yp(data[lo])); dotA.setAttribute('opacity', '1');
        dotB.setAttribute('cx', x1); dotB.setAttribute('cy', yp(data[hi])); dotB.setAttribute('opacity', '1');

        // Always chronological (earlier -> later), matching the dates shown,
        // regardless of which direction the user actually dragged.
        const startV = data[lo], endV = data[hi];
        const chg = endV - startV;
        const pct = startV ? (chg / startV) * 100 : 0;
        const sign = chg >= 0 ? '+' : '−';
        const swatch = chg >= 0 ? '#8fe0b6' : '#f0a8a8';
        label.innerHTML = `<span style="color:${swatch}">${sign} $${Math.abs(chg).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${chg >= 0 ? '+' : ''}${pct.toFixed(2)}%)</span><br><span style="font-weight:400;opacity:.85;font-size:11px">${fmtDate(labels[lo])} → ${fmtDate(labels[hi])}</span>`;
        label.style.opacity = '1';

        const rect = svg.getBoundingClientRect();
        const scaleX = rect.width / W;
        const midX = ((x0 + x1) / 2) * scaleX;
        let leftPx = midX - label.offsetWidth / 2;
        leftPx = Math.max(4, Math.min(rect.width - label.offsetWidth - 4, leftPx));
        label.style.left = leftPx + 'px';
        label.style.top = '4px';
      }

      function clearSel() {
        band.setAttribute('opacity', '0');
        lineA.setAttribute('opacity', '0'); lineB.setAttribute('opacity', '0');
        dotA.setAttribute('opacity', '0'); dotB.setAttribute('opacity', '0');
        label.style.opacity = '0';
      }

      svg.style.touchAction = 'none';
      svg.addEventListener('pointerdown', e => {
        dragging = true; moved = false;
        startIdx = idxFromClientX(e.clientX);
        svg.setPointerCapture(e.pointerId);
        hideTip(); hideCursorDot(svg.id); // don't let the existing hover tooltip fight the drag readout for attention
        paint(startIdx, startIdx);
        e.preventDefault();
      });
      svg.addEventListener('pointermove', e => {
        if (!dragging) return;
        const curIdx = idxFromClientX(e.clientX);
        if (curIdx !== startIdx) moved = true;
        hideTip(); hideCursorDot(svg.id);
        paint(startIdx, curIdx);
      });
      function endDrag() {
        if (!dragging) return;
        dragging = false;
        if (!moved) { clearSel(); startIdx = null; }
      }
      svg.addEventListener('pointerup', endDrag);
      svg.addEventListener('pointercancel', () => { dragging = false; clearSel(); });
    }

    function drawDonut(elId, slices) {
      const el = document.getElementById(elId);
      if (!el) return;
      const S = 220, cx = S / 2, cy = S / 2, R = 90, r = 50;
      const total = slices.reduce((s, d) => s + d.value, 0);
      let angle = -Math.PI / 2, paths = "";
      slices.forEach((d, i) => {
        const sweep = (d.value / total) * 2 * Math.PI;
        const tip = encodeURIComponent(`${d.name}: ${d.value}%`);
        if (sweep >= 2 * Math.PI - 0.001) {
          const fullR = `M ${cx},${cy - R} A ${R},${R} 0 1,1 ${cx},${cy + R} A ${R},${R} 0 1,1 ${cx},${cy - R} M ${cx},${cy - r} A ${r},${r} 0 1,0 ${cx},${cy + r} A ${r},${r} 0 1,0 ${cx},${cy - r} Z`;
          paths += `<path d="${fullR}" fill="${d.color}" stroke="white" stroke-width="2" style="cursor:default;transition:opacity .15s;animation:fadeIn 0.5s ease both;animation-delay:${i * 0.05}s" onmouseover="this.style.opacity='.72';showTip(event,'${tip}')" onmouseleave="this.style.opacity='1';hideTip()"/>`;
        } else {
          const x1 = cx + R * Math.cos(angle), y1 = cy + R * Math.sin(angle);
          const x2 = cx + R * Math.cos(angle + sweep), y2 = cy + R * Math.sin(angle + sweep);
          const x3 = cx + r * Math.cos(angle + sweep), y3 = cy + r * Math.sin(angle + sweep);
          const x4 = cx + r * Math.cos(angle), y4 = cy + r * Math.sin(angle);
          const lg = sweep > Math.PI ? 1 : 0;
          paths += `<path d="M ${x1.toFixed(2)},${y1.toFixed(2)} A ${R},${R} 0 ${lg},1 ${x2.toFixed(2)},${y2.toFixed(2)} L ${x3.toFixed(2)},${y3.toFixed(2)} A ${r},${r} 0 ${lg},0 ${x4.toFixed(2)},${y4.toFixed(2)} Z"
      fill="${d.color}" stroke="white" stroke-width="2" style="cursor:default;transition:opacity .15s;animation:fadeIn 0.5s ease both;animation-delay:${i * 0.05}s"
      onmouseover="this.style.opacity='.72';showTip(event,'${tip}')" onmouseleave="this.style.opacity='1';hideTip()"/>`;
        }
        angle += sweep + 0.01;
      });
      el.innerHTML = `<svg width="${S}" height="${S}" style="display:block;margin:0 auto;animation:scaleIn .4s ease both">${paths}</svg>`;
    }

    function showTip(e, tip) {
      const t = document.getElementById("gtt");
      if (!t) return;
      t.textContent = decodeURIComponent(tip);
      t.style.display = "block";
      requestAnimationFrame(() => t.classList.add("visible"));
      moveTip(e);
    }
    function moveTip(e) {
      const t = document.getElementById("gtt");
      if (!t || t.style.display === "none") return;
      const tw = t.offsetWidth, th = t.offsetHeight, m = 12;
      let x = e.clientX - tw / 2;
      let y = e.clientY - th - m;
      if (x < m) x = m;
      if (x + tw > window.innerWidth - m) x = window.innerWidth - tw - m;
      if (y < m) y = e.clientY + m;
      t.style.left = x + "px";

    async function fetchWithTimeout(url, ms = 8000) {
      return Promise.race([
        fetch(url),

      ]);

    function parseStooq(text) {
      try {
        const lines = text.trim().split("\n");
        if (lines.length < 2) return null;
        const out = [];
        for (let i = 1; i < lines.length; i++) {
          const p = lines[i].split(",");
          if (p.length < 5) continue;
          const date = p[0].trim();
          const close = parseFloat(p[4]);
          if (!date || isNaN(close)) continue;
          out.push({ date, close: +close.toFixed(4) });
        }
        return out.length > 5 ? out.sort((a, b) => a.date.localeCompare(b.date)) : null;
      } catch (e) { return null; }
    }

    function parseYahoo(d) {
      try {
        const r = d.chart.result[0];
        const ts = r.timestamp, closes = r.indicators.quote[0].close;
        const out = [];
        for (let i = 0; i < ts.length; i++) {
          if (closes[i] == null) continue;
          out.push({ date: new Date(ts[i] * 1000).toISOString().split("T")[0], close: +closes[i].toFixed(4) });
        }
        return out.length > 5 ? out : null;
      } catch (e) { return null; }
    }

    async function tryProxy(proxyUrl, isAllOrigins = false, timeoutMs = 18000) {
      const r = await Promise.race([
        fetch(proxyUrl),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), timeoutMs))
      ]);
      if (!r.ok) throw new Error("http " + r.status);
      let raw = await r.json();
      if (isAllOrigins) {
        if (typeof raw.contents === "string") raw = JSON.parse(raw.contents);
        else if (raw.contents && typeof raw.contents === "object") raw = raw.contents;
      }
      const parsed = parseYahoo(raw);
      if (!parsed || parsed.length < 5) throw new Error("no data");
      return parsed;
    }


    async function fetchHist(ticker) {

        return null;

    async function parallelLimit(tasks, limit) {
      const results = new Array(tasks.length);
      let idx = 0;
      async function worker() {
        while (idx < tasks.length) {
          const i = idx++;
          results[i] = await tasks[i]();
        }
      }
      await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
      return results;
    }

    let loadedTickers = [], failedTickers = [];

      if (ok) loadedTickers.push(ticker); else failedTickers.push(ticker);

      if (!el) return;
      const all = [...loadedTickers.map(t => `<span style="color:#059669;font-weight:600">${t}</span>`),
      ...failedTickers.map(t => `<span style="color:#94a3b8;text-decoration:line-through">${t}</span>`)];
      el.innerHTML = all.join("");

      // The countdown itself ("Updating in 01:34") is dev-facing noise —
      // nobody checking on the fund needs to know when the next silent

      const el = document.getElementById("next-update");

    async function loadAll(silent = false) {
      if (!silent) {
        const ls = document.getElementById("ls"), app = document.getElementById("app");
        if (ls) ls.style.display = "flex";
        if (app) app.style.display = "none";
      }
      loadedTickers = []; failedTickers = [];
      if (!silent) {
        setProg(0, "Loading fund data…", "");
        const tickerBox = document.getElementById("ls-tickers");
        if (tickerBox) tickerBox.style.display = "flex";
      }

      // Quotes and history used to run as two fully sequential phases — all
      // quotes had to finish before history even started — even though
      // neither depends on the other. On a higher-latency connection
      // (mobile networks especially) that doubles the wait for no reason:
      // now both run concurrently, so total time is roughly the slower of
      // the two instead of the sum of both.
      let qDone = 0, qOk = 0, histDone = 0, histAborted = false, histIdx = 0;
      function reportProgress() {
        if (silent || histAborted) return;
        const pct = Math.round(((qDone + histDone) / (HOLD.length * 2)) * 100);
        setProg(pct, `Loading: ${qDone}/${HOLD.length} quotes · ${histDone}/${HOLD.length} history`,
          `${loadedTickers.length} loaded · ${failedTickers.length} failed`);
      }

      const quoteTasks = HOLD.map((h, i) => async () => {
        try {
          const r = await fetchWithTimeout(`/api/quote?ticker=${h.t}`, 6000);
          const d = await r.json();
          if (d && d.c > 0) { prices[h.t] = { c: d.c, pc: d.pc || d.c * .999, hi: d.h, lo: d.l }; qOk++; invalidatePos(); }
        } catch (e) { }
        qDone++;
        reportProgress();
      });
      async function loadQuotes() { await parallelLimit(quoteTasks, 4); }

      const skipTimer = setTimeout(() => {
        const sb = document.getElementById("ls-skip"); if (sb) sb.style.display = "inline-block";
        setProg(null, "Taking a while…", "Proxies can be slow — skip to load app now, or wait for charts.");
      }, 8000);

      const skipPromise = new Promise(res => { _skipHistoryResolve = res; });

      // Fetches history for up to 4 holdings at a time (same concurrency
      // used for quotes) instead of one at a time with a 200ms pause between
      // each — that sequential-plus-sleep pattern was what made a
      // ~25-holding portfolio take 10-15 seconds to load on every cold
      // visit. Order of fetches is preserved (each of the 4 workers pulls
      // the next ticker off the same shared queue), only the concurrency
      // changed.
      async function historyWorker() {
        while (histIdx < HOLD.length && !histAborted) {
          const h = HOLD[histIdx++];
          let got = false;

          const s = await fetchHist(h.t);
          if (s) { hist[h.t] = s; got = true; }

          if (!got) {
            const y = await fetchHist(h.t);
            if (y) { hist[h.t] = y; got = true; }
          }

          if (!got && API_KEY) {
            try {
              const r = await fetchWithTimeout(`${FB}/stock/candle?symbol=${h.t}&resolution=D&count=1825&token=${API_KEY}`, 5000);
              const d = await r.json();
              if (d && d.s === "ok" && d.t && d.t.length > 5) {
                hist[h.t] = d.t.map((ts, j) => ({ date: new Date(ts * 1000).toISOString().split("T")[0], close: d.c[j] }));
                got = true;
              }
            } catch (e) { }
          }

          histDone++;
          addTickerStatus(h.t, got);
          reportProgress();
        }
      }
      async function loadHistSeq() {
        await Promise.all(Array.from({ length: Math.min(4, HOLD.length) }, historyWorker));
      }

      const winner = await Promise.race([
        Promise.all([loadQuotes(), loadHistSeq()]).then(() => "done"),
        skipPromise
      ]);
      histAborted = (winner === "skip");
      clearTimeout(skipTimer);
      const sb = document.getElementById("ls-skip"); if (sb) sb.style.display = "none";

      await loadData();

      if (!silent) {
        const ls = document.getElementById("ls"), app = document.getElementById("app");
        if (ls) ls.style.display = "none";
        if (app) app.style.display = "block";
      }
      isOffline = false;
      lastDataUpdate = new Date();
      saveSnapshotCache();
      updateSummary(true);
      render();
      if (!timer) timer = setInterval(tick, 1000);
    }


    async function loadTicker(ticker) {
      if (!ticker) return;
      loadedTickers = []; failedTickers = [];
      const ls = document.getElementById("ls");
      const app = document.getElementById("app");
      const tickerBox = document.getElementById("ls-tickers");
      if (tickerBox) { tickerBox.style.display = "flex"; tickerBox.innerHTML = `<span style="color:#64748b;font-weight:600">${ticker}</span>`; }
      if (ls) ls.style.display = "flex";
      if (app) app.style.display = "none";

      try {
        setProg(10, `Fetching ${ticker}…`, `Starting live quote load`);
        const quoteRes = await fetchWithRetry(`/api/quote?ticker=${ticker}`, {}, 2);
        const quoteData = await quoteRes.json();
        if (quoteData && quoteData.c > 0) {
          prices[ticker] = { c: quoteData.c, pc: quoteData.pc || quoteData.c * .999, hi: quoteData.h, lo: quoteData.l };
          setProg(35, `Price loaded for ${ticker}`, 'Fetching history...');
        } else {
          setProg(35, `Price unavailable for ${ticker}`, 'Fetching history anyway');
        }

        let history = await fetchHist(ticker);
        if (!history && API_KEY) {
          setProg(50, `History not found, trying fallback...`, `Trying a secondary data source`);
          try {
            const r = await fetchWithRetry(`${FB}/stock/candle?symbol=${ticker}&resolution=D&count=365&token=${API_KEY}`, {}, 1);
            const d = await r.json();
            if (d && d.s === "ok" && d.t && d.t.length > 5) {
              history = d.t.map((ts, j) => ({ date: new Date(ts * 1000).toISOString().split("T")[0], close: d.c[j] }));
            }
          } catch (e) { }
        }
        if (history) {
          hist[ticker] = history;
          addTickerStatus(ticker, true);
          setProg(100, `Loaded ${ticker}`, 'Ready');
        } else {
          addTickerStatus(ticker, false);
          setProg(100, `Failed loading ${ticker}`, 'Check ticker or API limits');
        }
      } catch (e) {
        addTickerStatus(ticker, false);
        setProg(null, `Error loading ${ticker}`, 'See console for details');
        console.error(e);
      } finally {
        buildPortHist();
        render();
        if (ls) ls.style.display = "none";
        if (app) app.style.display = "block";
      }
    }

    // Different tickers' price feeds don't all update on the same day (a
    // thinly-traded or recently-added holding can lag a day or two behind
    // the rest). Summing only whatever's literally present on each date
    // makes the total plunge on any trailing date where one holding's feed
    // hadn't caught up yet, even though nothing was actually sold. Forward-
    // fill each holding's last known price onto every date in the combined
    // calendar instead, so a lagging feed just holds its last value rather
    // than silently dropping out of the sum. Always unions dates across each
    // position's FULL history (never a pre-sliced window) — slicing before
    // combining lets one position's data "switch on" mid-series and get
    // added as a step-jump equal to its entire value, which reads as a fake
    // spike. Callers that only want a recent window should filter the
    // returned series by date afterward, not slice the inputs beforehand.
    function combineHoldingsValue(positions) {
      const allDates = new Set();
      positions.forEach(({ t }) => (hist[t] || []).forEach(({ date }) => allDates.add(date)));
      const sortedDates = [...allDates].sort();
      const dm = {};
      positions.forEach(({ t, sh, d: bought }) => {
        const h = hist[t] || [];
        if (!h.length) return;
        let idx = 0;
        sortedDates.forEach(date => {
          if (bought && date < bought) return; // not held yet — don't project current shares onto pre-purchase history
          while (idx < h.length - 1 && h[idx + 1].date <= date) idx++;
          if (h[idx].date <= date) dm[date] = (dm[date] || 0) + h[idx].close * sh;
        });
      });
      return sortedDates.filter(d => dm[d] != null).map(date => ({ date, value: +dm[date].toFixed(2) }));
    }
    // Windows a {date, value} series by real calendar months back from its
    // last entry (null months = no cutoff, i.e. "All Time") — same
    // calendar-cutoff approach as renderPerf's timeframe filter, so a
    // window like "1 Month" reflects an actual month, not a fixed row count.
    function filterByMonths(series, months) {
      if (months == null || !series.length) return series;
      const cutoff = new Date(series[series.length - 1].date + "T00:00:00Z");
      cutoff.setUTCMonth(cutoff.getUTCMonth() - months);
      const cutoffStr = cutoff.toISOString().split("T")[0];
      return series.filter(x => x.date >= cutoffStr);
    }
    function buildPortHist() {
      if (!_portHistDirty) return;
      portHist = combineHoldingsValue(HOLD).map(d => ({ date: d.date, v: d.value, value: d.value }));
      _portHistDirty = false;
    }

    function _buildPos() {
      return HOLD.map((h, i) => {
        const q = prices[h.t] || { c: 0, pc: 0 };
        const val = q.c * h.sh, cost = h.ac * h.sh, pnl = val - cost;
        const colorIdx = h.t.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) % DOTC.length;
        return {
          ...h, price: q.c, pc: q.pc, val, cost, pnl,
          pnlP: cost ? (pnl / cost) * 100 : 0,
          dayC: (q.pc && q.c) ? ((q.c - q.pc) / q.pc) * 100 : 0,
          color: DOTC[colorIdx]
        };
      });
    }
    function invalidatePos() { _posCache = null; _portHistDirty = true; }
    function getPos() {
      const key = HOLD.map(h => h.t + h.sh + h.ac).join(',') + JSON.stringify(prices).length;
      if (_posCache && key === _posCacheKey) return _posCache;
      _posCacheKey = key; _posCache = _buildPos(); _portHistDirty = true;
      return _posCache;
    }
    function getTot(pos) {
      const eV = pos.reduce((s, p) => s + p.val, 0), tC = pos.reduce((s, p) => s + p.cost, 0);
      return {
        tV: eV + CASH_BANK + CASH_BROK, tC, tP: eV - tC, tPct: tC ? ((eV - tC) / tC) * 100 : 0,
        dP: pos.reduce((s, p) => s + (p.price - p.pc) * p.sh, 0)
      };
    }
    function updateSummary(shouldSave = false) {
      const { tV, tC, tP, tPct, dP } = getTot(getPos());

      s("sv", fU(tV)); s("sco", fU(tC));
      s("sp", `${fS(tP)} (${fP(tPct)})`, cl(tP));
      s("sd", fS(dP), cl(dP));
      s("su", fU(tV / UNITS) + "/unit");
      buildPortHist();

      const summary = document.querySelector('.sg');
      if (summary) summary.style.display = curTab === 'dashboard' ? 'grid' : 'none';
      renderDataAsOf();
      renderNavControls();

      if (shouldSave) {
        saveHoldings();
        saveCash();
      }
    }
    function fmtAsOf(d) {
      if (!d) return "—";
      const now = new Date();
      const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (d.toDateString() === now.toDateString()) return `today at ${time}`;
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${MONTHS[d.getMonth()]} ${d.getDate()} at ${time}`;
    }
    // The cheapest, highest-value trust signal for an investor checking the
    // fund: an honest, unmissable "when was this actually last refreshed" —
    // not the live countdown (that's when the *next* refresh fires), and not
    // silently stale if the connection drops.
    function renderDataAsOf() {

    // The key (API key backup) and Save All buttons are manager tools with

        let svg = `<svg width="${W}" height="${H}" style="font-family:DM Sans,sans-serif">`;

          const cW = getW(w.c), pW = getW(w.p), spW = getW(w.sp);
          const barH = 7;
          const rowMid = y + bH / 2;

      const t = (document.getElementById("ft").value || "").toUpperCase().trim();
      const d = document.getElementById("fd").value || null;
      const s = parseFloat(document.getElementById("fs").value);
      const c = parseFloat(document.getElementById("fc").value);
      const sec = document.getElementById("fsec").value;
      if (!t || isNaN(s) || isNaN(c)) return;

      const btn = document.getElementById("upsert-btn");
      if (btn) { btn._savedOldText = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...'; btn.disabled = true; }

      const isNewTicker = HOLD.findIndex(h => h.t === t) < 0;
      const i = HOLD.findIndex(h => h.t === t);
      if (i >= 0) { HOLD[i].sh = s; HOLD[i].ac = c; HOLD[i].s = sec; HOLD[i].d = d; }
      else HOLD.unshift({ t, n: t, s: sec, sh: s, ac: c, d });

      invalidatePos();

      updateSummary(true);
      await saveHoldings();

      // Only the ticker that actually changed needs fresh data — no need to
      // re-fetch quotes/history for every other holding, which used to force
      // a full-screen reload on every single edit.
      try {
        await loadTickerQuiet(t, isNewTicker);

        if (d && d.c > 0) { prices[ticker] = { c: d.c, pc: d.pc || d.c * .999, hi: d.h, lo: d.l }; invalidatePos(); }

      if (needsHistory || !hist[ticker]) {

        if (h) hist[ticker] = h;

      const existing = document.querySelector(".cd-menu");

      const filtered = options.filter(o => !exclude.includes(o));
      const menu = document.createElement("div");
      menu.className = "cd-menu";
      menu._trigger = trigger;

      const rect = trigger.getBoundingClientRect();
      menu.style.top = (rect.bottom + 5) + "px";
      menu.style.left = rect.left + "px";
      menu.style.width = Math.max(rect.width, 220) + "px";

      filtered.forEach(opt => {
        const item = document.createElement("div");
        item.className = "cd-item";
        const dot = (SM[opt]?.color) ? `<div class="d9" style="background:${SM[opt].color}; width:8px; height:8px"></div>` : "";
        item.innerHTML = `${dot} <span>${opt}</span>`;
        item.onclick = (e) => { e.stopPropagation(); onSelect(opt); closeCD(); };
        menu.appendChild(item);
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "cd-item";
        empty.style.cssText = "color:var(--muted);cursor:default;font-weight:400";
        empty.textContent = "No options available";
        menu.appendChild(empty);
      }

      document.body.appendChild(menu);

      const onOutsideClick = (e) => {
        if (!menu.contains(e.target) && e.target !== trigger && !trigger.contains(e.target)) {
          closeCD();
          document.removeEventListener("click", onOutsideClick, true);
        }
      };
      setTimeout(() => document.addEventListener("click", onOutsideClick, true), 10);
    }

                  <td style="text-align:left;color:var(--muted);font-size:12px;white-space:nowrap">${r.d}</td>
                  <td style="font-weight:700;font-family:'DM Sans',sans-serif">$${r.u.toFixed(2)}</td>
                  <td style="color:var(--muted)">${r.sp?r.sp.toLocaleString():'—'}</td>
                  <td style="color:${mChg===null?'var(--muted)':mChg>=0?'var(--green)':'var(--red)'};font-weight:600">
                    ${mChg===null?'—':`${mChgAmt>=0?'+':''}$${Math.abs(mChgAmt).toFixed(2)} (${mChg>=0?'+':''}${mChg.toFixed(2)}%)`}
                  </td>
                  <td style="color:${sinceInc>=0?'var(--green)':'var(--red)'};font-weight:600">
                    ${sinceInc>=0?'+':''}${sinceInc.toFixed(1)}%
                  </td>
                  <td style="text-align:center;padding:6px 8px">
                    <button class="rmbtn" onclick="event.stopPropagation();uvRmv(${origIdx})" title="Remove entry"><i class="fa-solid fa-xmark"></i></button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

      // Color each chart by its own start-to-end direction — same green/red
      // convention the stat cards above already use (Current Unit Value's
      // arrow, Total Return) — instead of a color hardcoded to red
      // regardless of whether the fund was actually up or down over that
      // stretch.
      const trendColor = vals => (vals[vals.length - 1] >= vals[0] ? '#3fa874' : '#c95f5f');
      requestAnimationFrame(() => {
        const itdEl = document.getElementById('uv-chart-itd');
        const ttmEl = document.getElementById('uv-chart-ttm');
        if (itdEl) drawChart(itdEl, isoLabels, uVals, trendColor(uVals), 240, { dots: false, tight: false, yFmt: v => '$'+v.toFixed(0) });
        if (ttmEl) drawChart(ttmEl, ttmLabels, ttmVals, trendColor(ttmVals), 240, { dots: false, tight: false, yFmt: v => '$'+v.toFixed(0) });
      });
      if (uvEditIdx !== null) {
        const r = UNIT_HISTORY[uvEditIdx];
        const [m, day, y] = r.d.split('/').map(Number);
        const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dateEl = document.getElementById('uv-add-date');
        const valEl  = document.getElementById('uv-add-val');
        const spEl   = document.getElementById('uv-add-sp');
        if (dateEl) dateEl.value = dateStr;
        if (valEl)  valEl.value  = r.u;
        if (spEl)   spEl.value   = r.sp !== null ? r.sp : '';
      }
    }

    function startUVEdit(i) {
      uvEditIdx = i;
      renderUnitValue(document.getElementById('content'));
    }

    function cancelUVEdit() {
      uvEditIdx = null;
      renderUnitValue(document.getElementById('content'));
    }

    function uvRmv(i) {
      uvDeletingIdx = i;
      renderUVDeleteModal();
    }

    function uvCancelRmv() {
      uvDeletingIdx = null;
      renderUVDeleteModal();
    }

    function uvConfirmRmv() {
      if (uvDeletingIdx !== null) {
        UNIT_HISTORY.splice(uvDeletingIdx, 1);
        uvDeletingIdx = null;
        uvEditIdx = null;
        saveUnitValue();
        renderUVDeleteModal();
        renderUnitValue(document.getElementById('content'));
      }
    }

    function renderUVDeleteModal() {
      let delEl = document.getElementById("uv-delete-modal");
      if (!delEl) {
        delEl = document.createElement("div");
        delEl.id = "uv-delete-modal";
        document.body.appendChild(delEl);
      }
      if (uvDeletingIdx !== null) {
        const r = UNIT_HISTORY[uvDeletingIdx];
        delEl.innerHTML = `
      <div style="position:fixed; inset:0; background:rgba(45, 74, 62, 0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:500; animation: fadeIn .3s ease"></div>
      <div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:501;">
        <div style="background:var(--card); padding:32px; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,0.4); text-align:center; width:340px; animation: scaleIn .3s ease both;">
          <div style="width:64px; height:64px; background:#fef2f2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
            <i class="fa-solid fa-trash-can" style="font-size:24px; color:var(--red);"></i>
          </div>
          <div style="font-family:'DM Sans',sans-serif; font-weight:700; font-size:24px; color:var(--accent); margin-bottom:8px;">Are you sure?</div>
          <div style="font-size:14px; color:var(--muted); margin-bottom:28px; line-height:1.5">You are about to remove the entry for <b>${r.d}</b> ($${r.u.toFixed(2)}). This action cannot be undone.</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button class="fcb" onclick="uvCancelRmv()" style="margin:0; padding:0; height:44px;">Cancel</button>
            <button class="fb" onclick="uvConfirmRmv()" style="background:var(--red); border-color:var(--red); margin:0; padding:0; height:44px;"><i class="fa-solid fa-trash-can"></i> Remove</button>
          </div>
        </div>
      </div>`;
      } else {
        delEl.innerHTML = "";
      }
    }

    function updateUVEntry() {
      if (uvEditIdx === null) return;
      const dateEl = document.getElementById('uv-add-date');
      const valEl = document.getElementById('uv-add-val');
      const spEl  = document.getElementById('uv-add-sp');
      const u = parseFloat(valEl.value);
      const sp = spEl.value.trim() ? parseFloat(spEl.value) : null;
      if (isNaN(u) || u <= 0) return;
      if (dateEl && dateEl.value) {
        const [y, m, day] = dateEl.value.split('-').map(Number);
        UNIT_HISTORY[uvEditIdx].d = `${m}/${day}/${y}`;
      }
      UNIT_HISTORY[uvEditIdx].u = u;
      UNIT_HISTORY[uvEditIdx].sp = sp;
      UNIT_HISTORY.sort((a, b) => {
        const [am, ad, ay] = a.d.split('/').map(Number);
        const [bm, bd, by] = b.d.split('/').map(Number);
        return new Date(ay, am-1, ad) - new Date(by, bm-1, bd);
      });
      uvEditIdx = null;
      saveUnitValue();
      renderUnitValue(document.getElementById('content'));
    }

    function addUnitValueEntry() {
      const dateEl = document.getElementById('uv-add-date');
      const valEl  = document.getElementById('uv-add-val');
      const spEl   = document.getElementById('uv-add-sp');
      const rawDate = (dateEl.value || '').trim();
      const u = parseFloat(valEl.value);
      const sp = spEl.value.trim() ? parseFloat(spEl.value) : null;

      if (!rawDate) return;
      if (isNaN(u) || u <= 0) return;

      const [y, m, day] = rawDate.split('-').map(Number);
      const d = `${m}/${day}/${y}`;

      if (UNIT_HISTORY.find(r => r.d === d)) return;

      UNIT_HISTORY.push({ d, u, sp });
      UNIT_HISTORY.sort((a, b) => {
        const [am, ad, ay] = a.d.split('/').map(Number);
        const [bm, bd, by] = b.d.split('/').map(Number);
        return new Date(ay, am-1, ad) - new Date(by, bm-1, bd);
      });

      dateEl.value = ''; valEl.value = ''; spEl.value = '';
      saveUnitValue();
      renderUnitValue(document.getElementById('content'));
    }

    (async function boot() {
      const snap = loadSnapshotCache();
      if (snap) {
        // Instant path: paint from the last successful load instead of
        // blocking on a fresh sequential fetch of every ticker.
        HOLD = snap.HOLD || [];
        CASH_BANK = snap.CASH_BANK || 0;
        CASH_BROK = snap.CASH_BROK || 0;
        prices = snap.prices || {};
        weightingsData = snap.weightingsData || [];
        if (Array.isArray(snap.UNIT_HISTORY) && snap.UNIT_HISTORY.length) UNIT_HISTORY = snap.UNIT_HISTORY;
        if (snap.UNITS > 0) UNITS = snap.UNITS;
        lastDataUpdate = new Date(snap.ts);
        invalidatePos();
        document.getElementById("ls").style.display = "none";
        document.getElementById("app").style.display = "block";
        render();
        updateTabsFade();
        // hist (multi-year price series, needed for the Performance/Sectors
        // charts) isn't cached — refresh for real in the background so
        // those charts populate within a couple seconds instead of staying
        // on stale/empty data indefinitely.
        loadAll(true).catch(() => { isOffline = true; tick(); });
        return;
      }
      try {
        await loadData();
        await loadAll();
        setProg(100, "Ready", "All data loaded");
        await sleep(350);
        document.getElementById("ls").style.display = "none";
        document.getElementById("app").style.display = "block";

        render();
        updateTabsFade();

      } catch (e) {
        pauseProg("Failed to load — check your API key");
        showLsErr(e.message);
      }
    })();
  
    window.addEventListener('online', () => { isOffline = false; tc = 1; tick(); });
    window.addEventListener('offline', () => { isOffline = true; tick(); });

    // Swipe-anywhere-to-switch-tabs used to live here (mobile only). Removed:
    // it's a document-wide gesture with no way to know a drag started on a
    // chart meant to be dragged (e.g. the Performance chart's drag-to-measure),
    // so it kept hijacking chart interactions into tab switches. The tab bar
    // itself is still fully usable by tapping — that was never dependent on
    // this gesture.

    // The mobile tab strip hides its scrollbar (see .tabs::-webkit-scrollbar
    // above) so there's otherwise no hint that Weightings/Unit Value exist
    // off to the right. Show a fade on the trailing edge until scrolled to the end.
    function updateTabsFade() {
      const bar = document.querySelector('.nav-bottom');
      const strip = document.querySelector('.nav-bottom .tabs');
      if (!bar || !strip) return;
      const atEnd = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2;
      bar.classList.toggle('has-more', !atEnd && strip.scrollWidth > strip.clientWidth);
    }
    // #app (and its nav) is display:none until boot() finishes loading data,
    // so the first real measurement happens there — see updateTabsFade() call
    // in boot(), below. Listener can be attached right away, before that.
    (() => {
      const strip = document.querySelector('.nav-bottom .tabs');
      if (strip) strip.addEventListener('scroll', updateTabsFade, { passive: true });
    })();
    window.addEventListener('resize', updateTabsFade);
  </script>
</body>

</html>
